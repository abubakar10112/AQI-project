name: Feature Pipeline (Hourly)

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run the hourly update or perform the initial historical Supabase backfill'
        required: true
        default: hourly
        type: choice
        options:
          - hourly
          - backfill

env:
  AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_TABLE_NAME: aqi_features
  HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
  HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST || 'eu-west.cloud.hopsworks.ai' }}
  HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME || 'AQI_Abubakar' }}

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hourly feature update
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'hourly' }}
        run: |
          python -m src.feature_pipeline.data_fetcher
          echo "Hourly feature update completed successfully"

      - name: Backfill Supabase feature store
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill' }}
        run: |
          python -m src.feature_pipeline.backfill
          echo "Historical Supabase backfill completed successfully"
