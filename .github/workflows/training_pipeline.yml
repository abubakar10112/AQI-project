name: Training Pipeline (Daily)

on:
  schedule:
    # Run daily at 2 AM UTC (7 AM PKT)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
  HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
  HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST || 'eu-west.cloud.hopsworks.ai' }}
  HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME || 'AQI_Abubakar' }}
  FEATURE_STORE_BACKEND: hopsworks

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore feature store cache
        uses: actions/cache@v4
        with:
          path: data/features/
          key: feature-store-
          restore-keys: |
            feature-store-

      - name: Restore model registry cache
        uses: actions/cache@v4
        with:
          path: data/models/
          key: model-registry-${{ github.run_id }}
          restore-keys: |
            model-registry-

      - name: Run Training Pipeline
        run: |
          python -m src.training_pipeline.trainer
          echo "Training pipeline completed successfully"

      - name: Run SHAP Analysis
        run: |
          python -m src.analytics.explainability
          echo "SHAP analysis completed"
        continue-on-error: true

      - name: Save model registry cache
        uses: actions/cache@v4
        with:
          path: data/models/
          key: model-registry-${{ github.run_id }}

      - name: Upload model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            data/models/
            reports/
          retention-days: 30

      - name: Run Tests
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true
