name: Training Pipeline (Daily)

on:
  schedule:
    # Run daily at 2 AM UTC (7 AM PKT)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

env:
  AQICN_API_TOKEN: ${{ secrets.AQICN_API_TOKEN }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  SUPABASE_TABLE_NAME: aqi_features
  HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
  HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST || 'eu-west.cloud.hopsworks.ai' }}
  HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME || 'AQI_Abubakar' }}

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Training Pipeline
        run: |
          python -m src.training_pipeline.trainer
          echo "Training pipeline completed successfully"

      - name: Run SHAP Analysis
        run: |
          python -m src.analytics.explainability
          echo "SHAP analysis completed"

      - name: Upload evaluation and explainability reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-reports-${{ github.run_number }}
          path: |
            reports/
          retention-days: 30

      - name: Run Tests
        run: |
          pytest tests/ -v --tb=short
